<!doctype html>
<html><head><meta charset="utf-8">
<!-- Sophia Commons X header, 1500 x 500 (owner, 2026-11-20): the website's own logo, its display font,
     the TM and the blue mark on warm ivory, as at the top of sophiacommons.org -->
<style>
@font-face { font-family: 'SCDisplay'; src: url('sophia-commons-display.woff2') format('woff2'); font-weight: 400; }
html, body { margin: 0; padding: 0; }
.hdr {
  width: 1500px; height: 500px; position: relative; overflow: hidden; color: #1E1810;
  background:
    radial-gradient(ellipse 760px 420px at 750px 250px, rgba(214,180,100,.20), rgba(214,180,100,0) 72%),
    linear-gradient(180deg, #FDFBF7 0%, #F6F0E5 100%);
}
/* faint gold rings, a quiet nod to the Goetheanum domes */
.rings { position: absolute; left: 750px; top: 250px; width: 0; height: 0; }
.ring { position: absolute; border-radius: 50%; border: 1.5px solid rgba(184,146,58,.11); left: 50%; top: 50%; transform: translate(-50%,-50%); }
/* thin gold band along the bottom */
.band { position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: linear-gradient(90deg, rgba(184,146,58,0), #B8923A 30%, #B8923A 70%, rgba(184,146,58,0)); opacity: .8; }
.group { position: absolute; left: 0; right: 0; top: 0; bottom: 0; display: flex; align-items: center; justify-content: center; }
.text { display: flex; flex-direction: column; align-items: center; text-align: center; min-width: 0; }
.word { font-family: 'SCDisplay', Georgia, serif; font-weight: 400; font-size: 100px; letter-spacing: .02em; line-height: 1; white-space: nowrap; color: #1E1810; }
.word { position: relative; }
.word sup { position: absolute; left: 100%; top: 4px; font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 18px; letter-spacing: 0; color: #5E7B5A; margin-left: 6px; }
.rule { width: 620px; height: 2px; margin: 22px 0 18px; background: linear-gradient(90deg, rgba(184,146,58,0), #B8923A 25%, #B8923A 75%, rgba(184,146,58,0)); }
.tag { font-family: 'SCDisplay', Georgia, serif; font-size: 27px; letter-spacing: .03em; color: #4A3F33; white-space: nowrap; }
.foot { margin-top: 14px; font-family: 'SCDisplay', Georgia, serif; font-size: 20px; letter-spacing: .18em; text-transform: uppercase; color: #8A6A1F; white-space: nowrap; }
.url { position: absolute; left: 0; right: 0; text-align: center; bottom: 30px; font-family: 'SCDisplay', Georgia, serif; font-size: 21px; letter-spacing: .06em; color: #6B5E50; }
</style></head>
<body>
<div class="hdr" id="hdr">
  <div class="rings">
    <div class="ring" style="width:420px;height:420px"></div>
    <div class="ring" style="width:640px;height:640px;opacity:.7"></div>
    <div class="ring" style="width:880px;height:880px;opacity:.45"></div>
    <div class="ring" style="width:1140px;height:1140px;opacity:.28"></div>
  </div>
  <div class="group">
    <div class="text">
      <div class="word">Sophia Commons<sup>TM</sup></div>
      <div class="rule"></div>
      <div class="tag">The free directory of the anthroposophical movement worldwide</div>
      <div class="foot">Events &middot; Directory &middot; Weekly newsletter</div>
    </div>
  </div>
  <div class="url">sophiacommons.org</div>
  <div class="band"></div>
</div>
</body></html>
