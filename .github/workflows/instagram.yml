name: Weekly Instagram Reels (Monday events, Wednesday new listings, Friday newsletter, festivals)

# Owner, 2026-11-23: every Monday a Reel of this week's event pictures, set to a track from automation/ig_music/,
# goes to Instagram on its own, like the Monday X post. automation/instagram_post.py claims the week in instagram_posts first, so the backup runs
# never post twice; a failed run is retried at the next backup time.
# Owner, 2026-11-23: on Fridays the weekly newsletter also goes out as a Reel, once it has been sent (same times as the X post).
# Owner, 2026-11-23: Wednesdays, the week's new directory listings over a map; and every day a check for a
# festival (Advent, Epiphany, Easter, St. John's, Michaelmas) 1 to 3 days ahead, posted once (automation/ig_more_reels.py).
# Secrets: IG_USER_ID (Instagram Business account id), IG_ACCESS_TOKEN (long-lived or System User token).

on:
  schedule:
    - cron: "17 14,18,21 * * 1"     # Monday 6:17 am, backups 10:17 am and 1:17 pm Pacific
    - cron: "17 17,20,23 * * 3"     # Wednesday 9:17 am, 12:17 pm, 3:17 pm Pacific: new listings
    - cron: "17 17,20,23 * * 5"     # Friday 9:17 am, 12:17 pm, 3:17 pm Pacific: the newsletter, once sent
    - cron: "47 16 * * *"           # every day 8:47 am Pacific: a festival in the next 1 to 3 days
  workflow_dispatch:

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg (retries if the package mirror hiccups)
        run: |
          for try in 1 2 3; do
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && break
            echo "apt failed (try $try), waiting 20 s"
            sleep 20
          done
          command -v ffmpeg
      - name: Install Python packages
        id: deps
        run: pip install --quiet requests==2.32.3 Pillow==11.0.0
      - name: The day's Reel (events on Monday, new listings on Wednesday, newsletter on Friday)
        if: github.event.schedule != '47 16 * * *'
        run: |
          case "$(date -u +%u)" in
            1) python3 automation/instagram_post.py post ;;
            3) python3 automation/instagram_post.py post --new ;;
            5) python3 automation/instagram_post.py post --newsletter ;;
            *) echo "No weekly Reel today." ;;
          esac
      - name: A festival 1 to 3 days ahead (posts nothing on other days)
        if: always() && steps.deps.outcome == 'success'
        run: python3 automation/instagram_post.py post --festival
