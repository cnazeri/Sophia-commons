name: Daily YouTube sync + weekly link check

on:
  schedule:
    - cron: "17 13 * * *"        # every day 13:17 UTC (06:17 Pacific); link check runs on Sundays only
  workflow_dispatch:             # "Run workflow" button in the Actions tab

permissions:
  contents: write                # commit youtube_feed.json + crawl_reports/
  issues: write                  # open a "broken links" issue

concurrency:
  group: weekly
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - run: pip install --quiet -r automation/requirements.txt

      - name: Decide whether to run the weekly link check
        id: when
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date -u +%u)" = "7" ]; then
            echo "links=true" >> "$GITHUB_OUTPUT"
          else
            echo "links=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync YouTube channels and videos into Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}   # optional: enables new-channel discovery
        run: python3 automation/youtube_sync.py

      - name: Give new listings a map pin and a picture from their website
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 automation/new_listings.py

      - name: Facebook page and picture for new listings
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 automation/facebook_daily.py
        continue-on-error: true      # Facebook can rate-limit; never block the rest of the job

      - name: Collect news from anthroposophical feeds (pending until the admin publishes)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 automation/news_roundup.py

      - name: Review new news (article date from the page, Claude checks the topic; publishes or rejects)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 automation/news_review.py
        continue-on-error: true      # if it fails, stories just wait in Admin > News queue

      - name: Suggest posts for Admin > Featured post (organizations' own news feeds)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 automation/suggest_posts.py
        continue-on-error: true      # stops by itself until suggested_posts exists; the site does not depend on it

      - name: Mark events that have ended as past (their pages stay readable)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 automation/mark_past_events.py --apply
        continue-on-error: true      # stops by itself (changing nothing) until the read policy allows past

      - name: Tell search engines about new and changed pages (IndexNow)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 automation/indexnow.py --recent
        continue-on-error: true

      - name: Check every outbound link and resource
        if: steps.when.outputs.links == 'true'
        run: python3 automation/link_check.py

      - name: Commit feed snapshot and report
        run: |
          git config user.name  "sophia-commons-bot"
          git config user.email "bot@sophiacommons.org"
          git add automation/youtube_channels.json automation/youtube_feed.json
          [ -d crawl_reports ] && git add crawl_reports/
          git diff --cached --quiet || git commit -m "daily: youtube feed $(date -u +%F)"
          # someone may have pushed while this job ran: replay our snapshot commit on top, then push
          git pull --rebase --autostash origin main
          git push

      - name: Open or update the broken-links issue
        if: steps.when.outputs.links == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const rep = JSON.parse(fs.readFileSync('crawl_reports/link_report_latest.json', 'utf8'));
            const title = 'Weekly link report: broken links';
            const {data: open} = await github.rest.issues.listForRepo({owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'link-check'});
            const existing = open.find(i => i.title === title);
            if (rep.broken === 0 && rep.redirected === 0) {
              if (existing) await github.rest.issues.update({owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, state: 'closed'});
              return;
            }
            const md = fs.readFileSync(`crawl_reports/link_report_${rep.date}.md`, 'utf8');
            const body = md + `\n_Report: crawl_reports/link_report_${rep.date}.md_`;
            if (existing) {
              await github.rest.issues.update({owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body});
            } else {
              await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['link-check']});
            }
