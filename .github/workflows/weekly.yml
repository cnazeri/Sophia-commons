name: Daily YouTube sync + weekly link check

on:
  schedule:
    - cron: "17 13 * * *"        # every day 13:17 UTC (06:17 Pacific); link check runs on Sundays only
  workflow_dispatch:             # "Run workflow" button in the Actions tab

permissions:
  contents: write                # commit youtube_feed.json + crawl_reports/
  issues: write                  # open a "broken links" issue

concurrency:
  group: weekly
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet requests

      - name: Decide whether to run the weekly link check
        id: when
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date -u +%u)" = "7" ]; then
            echo "links=true" >> "$GITHUB_OUTPUT"
          else
            echo "links=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync YouTube channels and videos into Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}   # optional: enables new-channel discovery
        run: python3 automation/youtube_sync.py

      - name: Check every outbound link and resource
        if: steps.when.outputs.links == 'true'
        run: python3 automation/link_check.py

      - name: Commit feed snapshot and report
        run: |
          git config user.name  "sophia-commons-bot"
          git config user.email "bot@sophiacommons.org"
          git add automation/youtube_channels.json automation/youtube_feed.json
          [ -d crawl_reports ] && git add crawl_reports/
          git diff --cached --quiet || git commit -m "daily: youtube feed $(date -u +%F)"
          git push

      - name: Open or update the broken-links issue
        if: steps.when.outputs.links == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const rep = JSON.parse(fs.readFileSync('crawl_reports/link_report_latest.json', 'utf8'));
            const title = 'Weekly link report: broken links';
            const {data: open} = await github.rest.issues.listForRepo({owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'link-check'});
            const existing = open.find(i => i.title === title);
            if (rep.broken === 0 && rep.redirected === 0) {
              if (existing) await github.rest.issues.update({owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, state: 'closed'});
              return;
            }
            const md = fs.readFileSync(`crawl_reports/link_report_${rep.date}.md`, 'utf8');
            const body = md + `\n_Report: crawl_reports/link_report_${rep.date}.md_`;
            if (existing) {
              await github.rest.issues.update({owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body});
            } else {
              await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['link-check']});
            }
