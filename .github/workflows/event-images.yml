name: Event pictures

on:
  schedule:
    - cron: "40 15 * * *"        # daily; finds a share picture for new events that have none
  workflow_dispatch:             # "Run workflow" button in the Actions tab

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r automation/requirements.txt
      - name: Set pictures on events that have none (never replaces an existing picture)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 automation/scan_event_images.py --apply
